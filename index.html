  <section class="copy" id="copy">
    <h1>From chaos to something that works.</h1>
    <p>Projects · Systems · Digital Product</p>
  </section>

<script>
(() => {
  const SAMPLE_POINTS = 420;

  const stage = document.getElementById("stage");
  const copy = document.getElementById("copy");
  const originalSvg = document.getElementById("original-svg");
  const outputSvg = document.getElementById("morph-svg");

  const chaosSvg = document.querySelector("#chaos-source svg");
  const orderedSvg = document.querySelector("#ordered-source svg");

  const chaosPaths = [...chaosSvg.querySelectorAll("path")];
  const orderedLines = [...orderedSvg.querySelectorAll("polyline, path")];

  const chaosViewBox = chaosSvg.viewBox.baseVal;
  const orderedViewBox = orderedSvg.viewBox.baseVal;

  outputSvg.setAttribute(
    "viewBox",
    `${chaosViewBox.x} ${chaosViewBox.y} ${chaosViewBox.width} ${chaosViewBox.height}`
  );

  const xScale = chaosViewBox.width / orderedViewBox.width;
  const orderedYOffset = (chaosViewBox.height - orderedViewBox.height) / 2;

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function smoothstep(edge0, edge1, x) {
    const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  function easeInOutCubic(t) {
    return t < 0.5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function sampleGeometry(el, count, transformPoint) {
    const length = el.getTotalLength();
    const points = [];

    for (let i = 0; i < count; i++) {
      const distance = length * (i / (count - 1));
      const p = el.getPointAtLength(distance);

      points.push(transformPoint ? transformPoint(p) : {
        x: p.x,
        y: p.y
      });
    }

    return points;
  }

  function makeSyntheticTarget(index, total) {
    const orderedYValues = orderedLines.map(line => {
      const p = line.getPointAtLength(line.getTotalLength() / 2);
      return p.y;
    }).sort((a, b) => a - b);

    const minY = orderedYValues[0] ?? 0;
    const maxY = orderedYValues[orderedYValues.length - 1] ?? orderedViewBox.height;
    const y = orderedYOffset + minY + ((maxY - minY) * (index / Math.max(1, total - 1)));

    const points = [];

    for (let i = 0; i < SAMPLE_POINTS; i++) {
      points.push({
        x: chaosViewBox.width * (i / (SAMPLE_POINTS - 1)),
        y
      });
    }

    return points;
  }

  function pointsToPath(points) {
    if (!points.length) return "";

    let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;

    for (let i = 1; i < points.length; i++) {
      d += ` L ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)}`;
    }

    return d;
  }

  const lines = chaosPaths.map((chaosPath, index) => {
    const from = sampleGeometry(chaosPath, SAMPLE_POINTS);
    const orderedLine = orderedLines[index];

    const to = orderedLine
      ? sampleGeometry(orderedLine, SAMPLE_POINTS, p => ({
          x: p.x * xScale,
          y: p.y + orderedYOffset
        }))
      : makeSyntheticTarget(index, chaosPaths.length);

    const outputPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    outputPath.setAttribute("class", "morph-line");

    const strokeWidth = chaosPath.classList.contains("st0") ? "0.5" : "1";
    outputPath.setAttribute("stroke-width", strokeWidth);

    outputSvg.appendChild(outputPath);

    return {
      from,
      to,
      outputPath
    };
  });

  function render(progress) {
    const morphStart = 0.04;
    const morphEnd = 0.84;

    const morphRaw = clamp((progress - morphStart) / (morphEnd - morphStart), 0, 1);
    const t = easeInOutCubic(morphRaw);

    const originalOpacity = 1 - smoothstep(0.02, 0.08, progress);
    const morphOpacity = smoothstep(0.025, 0.09, progress);

    originalSvg.style.opacity = originalOpacity;
    outputSvg.style.opacity = morphOpacity;

    const bgT = smoothstep(0.08, 0.88, progress);
    const bg = {
      r: Math.round(10 + (240 - 10) * bgT),
      g: Math.round(10 + (236 - 10) * bgT),
      b: Math.round(10 + (228 - 10) * bgT)
    };

    const stroke = {
      r: Math.round(245 + (17 - 245) * bgT),
      g: Math.round(240 + (17 - 240) * bgT),
      b: Math.round(232 + (17 - 232) * bgT)
    };

    stage.style.background = `rgb(${bg.r}, ${bg.g}, ${bg.b})`;

    for (const line of lines) {
      const points = line.from.map((fromPoint, i) => {
        const toPoint = line.to[i];

        return {
          x: fromPoint.x + (toPoint.x - fromPoint.x) * t,
          y: fromPoint.y + (toPoint.y - fromPoint.y) * t
        };
      });

      line.outputPath.setAttribute("d", pointsToPath(points));
      line.outputPath.setAttribute("stroke", `rgb(${stroke.r}, ${stroke.g}, ${stroke.b})`);
    }

    const copyT = smoothstep(0.9, 1, progress);
    copy.style.opacity = copyT;
    copy.style.transform = `translateY(${(1 - copyT) * 24}px)`;
  }

  function update() {
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const progress = clamp(maxScroll > 0 ? window.scrollY / maxScroll : 0, 0, 1);
    render(progress);
  }

  window.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", update);

  render(0);

  console.info(`Chaos paths: ${chaosPaths.length}`);
  console.info(`Ordered lines: ${orderedLines.length}`);
  console.info("Text appears only after the morph is complete.");
})();
</script>
